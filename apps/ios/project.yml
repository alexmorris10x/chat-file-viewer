name: ChatFileViewer

options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  ChatFileViewer:
    type: application
    platform: iOS
    sources:
      - path: ChatFileViewer
        excludes:
          - Resources
      - path: ChatFileViewer/Resources/mermaid.min.txt
        buildPhase: resources
      - path: ChatFileViewer/Resources/marked.min.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.chatfileviewer
        PRODUCT_NAME: ChatFileViewer
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 98CDQPW36W
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CHAT_FILE_VIEWER_DISPLAY_NAME: Chat File Viewer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ChatFileViewer/Info.plist
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.10x.chatfileviewer.dev
          CHAT_FILE_VIEWER_DISPLAY_NAME: Chat File Viewer Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
    preBuildScripts:
      - name: Validate App Identity
        script: /bin/bash "$SRCROOT/../../scripts/validate-app-identity.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/../../scripts/validate-app-identity.sh
    dependencies:
      - target: ChatFileViewerShare
        embed: true

  ChatFileViewerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ChatFileViewerShare
      - path: ChatFileViewer/Shared
      - path: ChatFileViewer/Resources/mermaid.min.txt
        buildPhase: resources
      - path: ChatFileViewer/Resources/marked.min.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.chatfileviewer.share
        PRODUCT_NAME: ChatFileViewerShare
        CHAT_FILE_VIEWER_DISPLAY_NAME: Open in Chat File Viewer
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 98CDQPW36W
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ChatFileViewerShare/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.10x.chatfileviewer.dev.share
          CHAT_FILE_VIEWER_DISPLAY_NAME: Open in Chat File Viewer Dev
    preBuildScripts:
      - name: Validate App Identity
        script: /bin/bash "$SRCROOT/../../scripts/validate-app-identity.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/../../scripts/validate-app-identity.sh

  ChatFileViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChatFileViewerTests
      - path: ChatFileViewer/Shared
    dependencies:
      - target: ChatFileViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.chatfileviewer.tests
        GENERATE_INFOPLIST_FILE: YES

  ChatFileViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChatFileViewerUITests
    dependencies:
      - target: ChatFileViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.chatfileviewer.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChatFileViewer

schemes:
  ChatFileViewer:
    build:
      targets:
        ChatFileViewer: all
        ChatFileViewerShare: all
    test:
      targets:
        - ChatFileViewerTests
        - ChatFileViewerUITests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
